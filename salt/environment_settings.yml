environments:
  applications-qa:
    vpc_name: OL Applications QA
    purposes:
  applications-production:
    purposes:
  operations:
    business_unit: operations
    network_prefix: '10.0'
    vpc_name: mitodl-operations-services
    purposes:
      consul:
        apps:
          - consul
          - vault
        num_instances: 3
        size: t3.medium
        business_unit: operations
        security_groups:
          - vault
          - consul
    backends:
      pki:
        - consul
      rds:
        - name: saltmaster
          multi_az: True
          engine: postgres
          vault_plugin: postgresql-database-plugin
          db_instance_class: db.t2.small
          allocated_storage: 100
          public_access: False
          engine_version: '10.1'
          purpose: saltmaster
  operations-qa:
    business_unit: operations
    network_prefix: '10.1'
    vpc_name: operations-qa
    purposes:
      consul:
        apps:
          - consul
          - vault
        num_instances: 3
        size: t3.medium
        business_unit: operations
        security_groups:
          - vault
          - consul
    backends:
      pki:
        - consul
      rds:
        - name: saltmaster
          multi_az: True
          engine: postgres
          vault_plugin: postgresql-database-plugin
          db_instance_class: db.t2.small
          allocated_storage: 100
          public_access: False
          engine_version: '10.1'
          purpose: saltmaster
  production-apps:
    business_unit: operations
    network_prefix: '10.13'
    vpc_name: Production Apps
    vpc_peers:
      - mitodl-operations-services
    purposes:
      reddit:
        app: reddit
        domains:
          - discussions-reddit-production-apps.odl.mit.edu
        num_instances: 3
        business_unit: operations
        healthcheck: /health
        security_groups:
          - webapp
    backends:
      pki:
        - cassandra
        - consul
        - rabbitmq
      rds:
        - name: reddit
          multi_az: True
          engine: postgresql
          vault_plugin: postgresql-database-plugin
          mount_point: postgresql-production-apps-reddit
          db_instance_class: db.m4.large
          allocated_storage: 100
          public_access: False
          engine_version: '9.6.11'
          service_name: postgresql-reddit
          purpose: reddit
          replica:
            db_instance_class: db.t2.medium
      elasticache:
        - engine: memcached
          engine_version: '1.4.34'
          node_type: cache.t2.medium
          num_cache_nodes: 2
          purpose: reddit
          cluster_id: reddit-memcached
  rc-apps:
    business_unit: operations
    network_prefix: '10.12'
    vpc_name: RC Apps
    vpc_peers:
      - operations-qa
    purposes:
      reddit:
        app: reddit
        domains:
          - discussions-reddit-rc-apps.odl.mit.edu
        num_instances: 2
        business_unit: operations
        healthcheck: /health
        security_groups:
          - webapp
    backends:
      pki:
        - cassandra
        - consul
        - rabbitmq
      rds:
        - name: reddit
          multi_az: False
          # This needs to be changed if/when we redeploy this host.
          # It is only like this to fix Consul pillar rendering
          engine: postgresql
          engine_version: '9.6.11'
          vault_plugin: postgresql-database-plugin
          db_instance_class: db.t2.small
          allocated_storage: 100
          public_access: False
      elasticache:
        - engine: memcached
          engine_version: '1.4.34'
          node_type: cache.t2.medium
          num_cache_nodes: 2
          purpose: reddit-rc
          cluster_id: reddit-rc-memcached

business_units:
  - operations
  - mit-open
